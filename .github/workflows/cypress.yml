name: Uberjar

on:
  push:
    branches:
      - '**'
  pull_request:
    paths-ignore:
    - 'docs/**'

jobs:

  e2e-tests:
    runs-on: self-hosted
    timeout-minutes: 45
    name: e2e-tests-${{ matrix.folder }}-${{ matrix.edition }}
    env:
      MB_EDITION: ${{ matrix.edition }}
      DISPLAY: ""
      QA_DB_ENABLED: true
    strategy:
      fail-fast: false
      matrix:
        edition: [oss]
        folder: [admin, binning, collections, custom-column, dashboard, dashboard-filters, dashboard-filters-sql, downloads, models, moderation, native, native-filters, onboarding, permissions, question, sharing, smoketest, visualizations]
    services:
      maildev:
        image: maildev/maildev
        ports:
          - "9080:80"
          - "9025:25"
      postgres-sample:
        image: metabase/qa-databases:postgres-sample-12
        ports:
          - "5432:5432"
      mongo-sample:
        image: metabase/qa-databases:mongo-sample-4.0
        ports:
          - 27017:27017
      mysql-sample:
        image: metabase/qa-databases:mysql-sample-8
        ports:
          - 3306:3306
    steps:
    - name: Wait for Uberjar build
      uses: fountainhead/action-wait-for-check@v1.0.0
      with:
        checkName: build-uberjar-${{ matrix.edition }}
        timeoutSeconds: 1800
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        token: ${{ secrets.GITHUB_TOKEN }}
    - uses: actions/checkout@v2
    - name: Grab built Uberjar from cache
      uses: actions/cache@v2
      with:
        key:  cache-v1-uberjar-${{ matrix.edition }}--${{ github.event.pull_request.head.sha || github.sha }}
        path: ./target/uberjar/metabase.jar
    - name: Prepare Node.js
      uses: actions/setup-node@v1
      with:
        node-version: 14.x
    - name: Prepare JDK 8
      uses: actions/setup-java@v2
      with:
        java-version: 8
        distribution: 'temurin'
    - name: Check versions
      run: |
        echo "Node.js `node --version`"
        echo "yarn `yarn --version`"
        java -version
    - name: Get yarn cache
      uses: actions/cache@v2
      with:
        path: ~/.cache/yarn
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
    - name: Get node_modules cache
      uses: actions/cache@v2
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
    - name: Ensure that Cypress is ready
      run: |
        yarn cypress install
        yarn cypress cache path
        yarn cypress cache list
        yarn cypress verify
    - name: Get M2 cache
      uses: actions/cache@v2
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/project.clj') }}-${{ hashFiles('**/deps.edn') }}

    - name: Get the version info
      run: |
        jar xf target/uberjar/metabase.jar version.properties
        cat version.properties
        mv version.properties resources/

    - run: yarn install --frozen-lockfile --prefer-offline
    - run: yarn run test-cypress-no-build --folder ${{ matrix.folder }}
      name: Run Cypress tests on ${{ matrix.folder }}
      env:
        TERM: xterm
    - name: Upload Cypress recording upon failure
      uses: actions/upload-artifact@v2
      if: failure()
      with:
        retention-days: 3
        name: cypress-recording-${{ matrix.folder }}
        path: ./cypress
        if-no-files-found: ignore
