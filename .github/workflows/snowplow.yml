name: Snowplow

on:
  pull_request:
    branches:
      - '**'
    paths:
      - 'snowplow/**'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: self-hosted
    container: snowplow/igluctl:0.6.0
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Lint
        run: igluctl lint snowplow
