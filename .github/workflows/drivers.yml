name: Driver Tests

on:
  push:
    branches:
      - 'master'
      - 'release-**'
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "frontend/test/**"
      - "enterprise/frontend/test/**"

jobs:

  be-tests-mysql-5-7-ee:
    runs-on: ubuntu-20.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DRIVERS: mysql
      MB_DB_TYPE: mysql
      MB_DB_HOST: localhost
      MB_DB_PORT: 3306
      MB_DB_DBNAME: circle_test
      MB_DB_USER: root
      MB_MYSQL_TEST_USER: root
    services:
      mysql:
        image: circleci/mysql:5.7.23
        ports:
          - "3306:3306"
    steps:
    - uses: actions/checkout@v3
    - name: Test MySQL driver (5.7)
      uses: ./.github/actions/test-driver
      with:
        junit-name: 'be-tests-mysql-5-7-ee'

  be-tests-postgres-ee:
    runs-on: ubuntu-20.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DRIVERS: postgres
      MB_DB_TYPE: postgres
      MB_DB_PORT: 5432
      MB_DB_HOST: localhost
      MB_DB_DBNAME: circle_test
      MB_DB_USER: circle_test
      MB_POSTGRESQL_TEST_USER: circle_test
    services:
      postgres:
        image: circleci/postgres:9.6-alpine
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: circle_test
          POSTGRES_DB: circle_test
    steps:
    - uses: actions/checkout@v3
    - name: Test Postgres driver (9.6)
      uses: ./.github/actions/test-driver
      with:
        junit-name: 'be-tests-postgres-ee'

  be-tests-postgres-latest-ee:
    runs-on: ubuntu-20.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DRIVERS: postgres
      MB_DB_TYPE: postgres
      MB_DB_PORT: 5432
      MB_DB_HOST: localhost
      MB_DB_DBNAME: circle_test
      MB_DB_USER: circle_test
      MB_POSTGRESQL_TEST_USER: circle_test
      MB_POSTGRES_SSL_TEST_SSL: true
      MB_POSTGRES_SSL_TEST_SSL_MODE: verify-full
      MB_POSTGRES_SSL_TEST_SSL_ROOT_CERT_PATH: 'test-resources/certificates/us-east-2-bundle.pem'
    services:
      postgres:
        image: circleci/postgres:latest
        ports:
          - "5432:5432"
        env:
          POSTGRES_USER: circle_test
          POSTGRES_DB: circle_test
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
    - uses: actions/checkout@v3
    - name: Test Postgres driver (latest)
      uses: ./.github/actions/test-driver
      with:
        junit-name: 'be-tests-postgres-latest-ee'

  be-tests-sqlite-ee:
    runs-on: ubuntu-20.04
    timeout-minutes: 20
    env:
      CI: 'true'
      DRIVERS: sqlite
    steps:
    - uses: actions/checkout@v3
    - name: Test SQLite driver
      uses: ./.github/actions/test-driver
      with:
        junit-name: 'be-tests-sqlite-ee'
