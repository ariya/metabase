name: Backend

on:
  pull_request:
  push:
    branches:
      - '**'
    paths:
    - 'src/**'
    - 'enterprise/backend/**'
    - '**/deps.edn'
    - '.github/workflows/**'

jobs:

  be-build:
    runs-on: ubuntu-20.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v2
    - name: Prepare Node.js
      uses: actions/setup-node@v1
      with:
        node-version: 14.x
    - name: Prepare JDK 8
      uses: actions/setup-java@v2
      with:
        java-version: 8
        distribution: 'temurin'
    - name: Install Clojure CLI
      run: |
        curl -O https://download.clojure.org/install/linux-install-1.10.3.933.sh &&
        sudo bash ./linux-install-1.10.3.933.sh
    - name: Check versions
      run: |
        java -version
        clojure --version
        node --version
        yarn --version

    - name: Get yarn cache
      uses: actions/cache@v2
      with:
        path: ~/.cache/yarn
        key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
    - name: Get node_modules cache
      uses: actions/cache@v2
      with:
        path: node_modules
        key: ${{ runner.os }}-node-modules-${{ hashFiles('**/yarn.lock') }}
    - name: Get M2 cache
      uses: actions/cache@v2
      with:
        path: |
          ~/.m2
          ~/.gitlibs
        key: ${{ runner.os }}-m2-jdk8-${{ hashFiles('**/deps.edn') }}

    - run: yarn install --frozen-lockfile --prefer-offline
    - name: Build static viz frontend
      run: yarn build-static-viz

    - name: Compile Java source file(s)
      run: clojure -X:deps prep
    - name: Compile driver AOT namespaces
      working-directory: modules/drivers
      run: clojure -X:deps prep
    - name: Fetch dependencies
      run: clojure -P -X:dev:ci:ee:ee-dev:drivers:drivers-dev
    - name: Fetch dependencies  (./bin/build/build-mb)
      working-directory: bin/build-mb
      run: clojure -P -M:test
    - name: Fetch dependencies (./bin/build/build-drivers)
      working-directory: bin/build-drivers
      run: clojure -P -M:test
    - name: Run tests as be-tests-oss
      run: clojure -X:dev:ci:test:oss:oss-dev
    - name: Run tests as be-tests-ee
      run: clojure -X:dev:ci:test:ee:ee-dev



